const $ = (sel) => document.querySelector(sel);
const render = (html) => { $('#app').innerHTML = html; attachEvents(); };

function attachEvents() {
  $('#app').onclick = (e) => {
    const t = e.target.closest('[data-action]');
    if (!t) return;
    const action = t.dataset.action;
    const val = t.dataset.value;

    if (action === 'nav') navigate(val);
    if (action === 'login') handleLogin(val);
    if (action === 'logout') { state.user = null; navigate('login'); }
    if (action === 'tab') { state.dashboardTab = val; navigate('dashboard'); }
    if (action === 'template-modal') { state.selectedTemplate = TEMPLATES.find(x=>x.id===val); navigate('templates'); }
    if (action === 'close-modal') { state.selectedTemplate = null; navigate('templates'); }
    if (action === 'toast') showToast(val);
  };

  $('#app').onsubmit = (e) => {
    if (e.target.id === 'loginForm') {
      e.preventDefault();
      handleLogin('manager');
    }
  };
}

function navigate(view) {
  state.view = view;
  const views = {
    login: renderLogin,
    dashboard: renderDashboard,
    mywork: renderMyWork,
    projects: renderProjects,
    testing: renderTesting,
    deployments: renderDeployments,
    templates: renderTemplates,
    suggestions: renderSuggestions,
    audit: renderAudit,
    reports: renderReports,
    settings: renderSettings
  };
  (views[view] || renderDashboard)();
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'fixed bottom-4 right-4 bg-slate-800 border border-slate-700 text-white px-4 py-2 rounded-lg shadow-xl text-sm fade-in z-50';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function handleLogin(role) {
  state.user = USERS[role] || USERS.manager;
  const home = { manager: 'dashboard', tester: 'mywork', engineer: 'mywork', auditor: 'audit' }[role];
  navigate(home || 'dashboard');
}

      <h3 class="text-sm font-semibold mb-4">Notifications</h3>
      <div class="space-y-2">
        ${[{l:'Approval requests',d:'When someone requests approval',c:true},{l:'Execution completions',d:'When assigned runs finish',c:true},{l:'Deployment failures',d:'Critical alerts',c:true},{l:'Weekly digest',d:'Summary email',c:false}].map(n=>`
          <label class="flex items-center justify-between p-3 bg-slate-900 border border-slate-800 rounded cursor-pointer">
            <div><div class="text-sm font-medium">${n.l}</div><div class="text-xs text-slate-400">${n.d}</div></div>
            <input type="checkbox" ${n.c?'checked':''} class="w-4 h-4 rounded bg-slate-800 border-slate-700 text-indigo-500">
          </label>
        `).join('')}
      </div>
    </div>
    <div class="card p-5">
      <h3 class="text-sm font-semibold mb-4">Workspace</h3>
      <div class="space-y-2">
        ${[{l:'Security & Access',d:'SSO, 2FA, sessions'},{l:'Team Members',d:'Invite & manage access'},{l:'Integrations',d:'CI/CD, monitoring tools'},{l:'API Keys',d:'External access tokens'}].map(w=>`
          <div class="flex items-center justify-between p-3 bg-slate-900 border border-slate-800 rounded cursor-pointer hover:border-slate-700">
            <div><div class="text-sm font-medium">${w.l}</div><div class="text-xs text-slate-400">${w.d}</div></div>
            <span class="text-slate-500">→</span>
          </div>
        `).join('')}
      </div>
    </div>
  `));
}
